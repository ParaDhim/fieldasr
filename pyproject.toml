[project]
name = "fieldasr"
version = "0.1.0"
description = "Low-resource (Swahili) speech recognition under field conditions: QC, field-realistic eval, fine-tuning, review tool, PII scrubbing, CPU deployment."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tabulate>=0.9",
]

[project.optional-dependencies]
train = ["torch>=2.3", "torchaudio>=2.3", "transformers>=4.44", "peft>=0.12", "accelerate>=0.33", "datasets>=2.20", "mlflow>=2.15", "evaluate>=0.4"]
deploy = ["ctranslate2>=4.3", "faster-whisper>=1.0", "fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
app = ["gradio>=4.40"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[project.scripts]
fieldasr = "fieldasr.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
